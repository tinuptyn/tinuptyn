project:
  name: sample-medium-project

unit:
  path: tests/unit
  pattern: "test_*.py"

integration:
  path: tests/integration
  pattern: "test_*.py"
  services:
    - name: postgres
      start_cmd: "docker compose up db"
      healthcheck: "tcp://localhost:5432"
    - name: redis
      start_cmd: "docker compose up cache"
      healthcheck: "tcp://localhost:6379"
  startup_timeout: 45

performance:
  path: tests/performance
  pattern: "test_*.py"
  defaults:
    repeats: 5
    warmup_iterations: 1
    threshold_ms: 250

reporting:
  console: true
  json: true
  output_dir: artifacts

runtime:
  env:
    APP_ENV: test
  pythonpath:
    - app
