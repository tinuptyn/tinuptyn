<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生活服务 · 实时天气组件</title>
  <style>
    :root {
      font-family: "Inter", "PingFang SC", "Helvetica Neue", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #fef9f3 0%, #f2f7ff 40%, #dde8ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .weather-shell {
      width: min(420px, 100%);
      background: rgba(255, 255, 255, 0.85);
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(0, 38, 121, 0.18);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      overflow: hidden;
    }

    header {
      padding: 24px 28px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    header h1 {
      font-size: 20px;
      margin: 0;
      color: #0f172a;
    }

    header p {
      margin: 0;
      color: #475569;
      font-size: 14px;
    }

    .search-bar {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .search-bar input {
      flex: 1;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      background: rgba(255, 255, 255, 0.9);
    }

    .search-bar input:focus {
      border-color: #2563eb;
    }

    .search-bar button {
      border: none;
      border-radius: 16px;
      padding: 10px 16px;
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.35);
    }

    .search-bar button:hover {
      transform: translateY(-1px);
      box-shadow: 0 15px 30px rgba(37, 99, 235, 0.4);
    }

    main {
      padding: 0 28px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      border-radius: 24px;
      padding: 20px;
      background: linear-gradient(135deg, #e0f2ff, #fef3c7);
      color: #0f172a;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.7), transparent 45%);
      pointer-events: none;
    }

    .temp {
      font-size: 56px;
      font-weight: 600;
      margin: 0;
    }

    .big-icon {
      font-size: 48px;
      margin-bottom: 4px;
    }

    .subtle {
      color: #475569;
      font-size: 13px;
      margin: 4px 0 0;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      grid-column: span 2;
    }

    .stat {
      flex: 1;
      background: rgba(15, 23, 42, 0.05);
      border-radius: 16px;
      padding: 12px;
    }

    .stat-title {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 16px;
      color: #0f172a;
      font-weight: 600;
    }

    .chart-card {
      border-radius: 24px;
      padding: 20px;
      background: #ffffff;
      border: 1px solid rgba(226, 232, 240, 0.9);
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .chart-header h3 {
      margin: 0;
      font-size: 15px;
      color: #0f172a;
    }

    .chart-header span {
      font-size: 12px;
      color: #94a3b8;
    }

    canvas {
      width: 100%;
      height: 160px;
    }

    .chip-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.2);
      font-size: 12px;
      color: #475569;
      white-space: nowrap;
    }

    .error {
      padding: 12px 16px;
      border-radius: 16px;
      background: rgba(239, 68, 68, 0.08);
      color: #b91c1c;
      font-size: 13px;
    }

    .loading {
      text-align: center;
      font-size: 14px;
      color: #475569;
    }

    @media (max-width: 480px) {
      .weather-shell {
        border-radius: 0;
        min-height: 100vh;
      }

      body {
        padding: 0;
      }

      main {
        padding-bottom: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="weather-shell">
    <header>
      <h1>实时天气服务</h1>
      <p>输入城市，获取当前天气与未来 12 小时趋势。组件可直接嵌入任意生活服务类页面。</p>

      <div class="search-bar">
        <input id="cityInput" type="text" placeholder="例如：上海 / 深圳 / 成都" />
        <button id="searchBtn">查询</button>
      </div>
      <button id="locBtn" style="margin-top:10px;border:none;background:none;color:#2563eb;font-size:13px;cursor:pointer;align-self:flex-start;">
        ▸ 使用当前位置
      </button>
    </header>
    <main>
      <div id="errorBox" class="error" style="display:none;"></div>
      <div id="loading" class="loading">选择城市即可查看实时天气</div>

      <section id="currentCard" class="card" style="display:none;">
        <div>
          <div class="big-icon" id="emoji">☁️</div>
          <p class="temp"><span id="tempValue">--</span>°C</p>
          <p class="subtle" id="conditionText">晴 / 阴 / 雨...</p>
          <p class="subtle" id="updateTime">--:-- 更新</p>
        </div>
        <div class="stats">
          <div class="stat">
            <div class="stat-title">体感温度</div>
            <div class="stat-value" id="feelsLike">--°C</div>
          </div>
          <div class="stat">
            <div class="stat-title">湿度</div>
            <div class="stat-value" id="humidity">--%</div>
          </div>
          <div class="stat">
            <div class="stat-title">风速</div>
            <div class="stat-value" id="wind">-- km/h</div>
          </div>
        </div>
      </section>

      <section id="chartCard" class="chart-card" style="display:none;">
        <div class="chart-header">
          <h3>未来 12 小时温度</h3>
          <span id="rangeLabel">--</span>
        </div>
        <canvas id="tempChart" width="360" height="160"></canvas>
        <div class="chip-row" id="hourlyChips"></div>
      </section>
    </main>
  </div>

  <script>
    const cityInput = document.querySelector("#cityInput");
    const searchBtn = document.querySelector("#searchBtn");
    const locBtn = document.querySelector("#locBtn");
    const errorBox = document.querySelector("#errorBox");
    const loading = document.querySelector("#loading");
    const currentCard = document.querySelector("#currentCard");
    const chartCard = document.querySelector("#chartCard");
    const tempValue = document.querySelector("#tempValue");
    const feelsLike = document.querySelector("#feelsLike");
    const humidity = document.querySelector("#humidity");
    const wind = document.querySelector("#wind");
    const conditionText = document.querySelector("#conditionText");
    const emoji = document.querySelector("#emoji");
    const updateTime = document.querySelector("#updateTime");
    const rangeLabel = document.querySelector("#rangeLabel");
    const hourlyChips = document.querySelector("#hourlyChips");
    const tempCanvas = document.querySelector("#tempChart");
    const ctx = tempCanvas.getContext("2d");

    const WEATHER_CODE_MAP = {
      0: { text: "晴朗", icon: "☀️" },
      1: { text: "多云", icon: "🌤️" },
      2: { text: "阴", icon: "☁️" },
      3: { text: "阴", icon: "☁️" },
      45: { text: "雾", icon: "🌫️" },
      48: { text: "雾", icon: "🌫️" },
      51: { text: "细雨", icon: "🌧️" },
      53: { text: "细雨", icon: "🌧️" },
      55: { text: "细雨", icon: "🌧️" },
      61: { text: "小雨", icon: "🌧️" },
      63: { text: "中雨", icon: "🌧️" },
      65: { text: "大雨", icon: "🌧️" },
      71: { text: "小雪", icon: "🌨️" },
      73: { text: "中雪", icon: "🌨️" },
      75: { text: "大雪", icon: "❄️" },
      95: { text: "雷阵雨", icon: "⛈️" },
      99: { text: "雷暴伴冰雹", icon: "🌩️" },
    };

    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error("网络请求失败");
      return res.json();
    }

    function showError(msg) {
      errorBox.style.display = "block";
      errorBox.textContent = msg;
    }

    function clearError() {
      errorBox.style.display = "none";
      errorBox.textContent = "";
    }

    function setLoading(state) {
      loading.style.display = state ? "block" : "none";
      loading.textContent = state ? "正在获取实时天气..." : "";
    }

    async function geocode(city) {
      const data = await fetchJSON(
        `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=zh&format=json`
      );
      if (!data.results || data.results.length === 0) throw new Error("未找到该城市，请重新输入");
      const place = data.results[0];
      return {
        name: `${place.name}${place.admin1 ? " · " + place.admin1 : ""}`,
        latitude: place.latitude,
        longitude: place.longitude,
      };
    }

    async function fetchWeather({ latitude, longitude }) {
      const query = new URLSearchParams({
        latitude,
        longitude,
        current: "temperature_2m,apparent_temperature,wind_speed_10m,relative_humidity_2m,weather_code",
        hourly: "temperature_2m,weather_code",
        timezone: "auto",
      });
      return fetchJSON(`https://api.open-meteo.com/v1/forecast?${query.toString()}`);
    }

    function renderCurrent(locationName, weather) {
      const { current } = weather;
      const codeMeta = WEATHER_CODE_MAP[current.weather_code] || { text: "多变天气", icon: "🌦️" };

      emoji.textContent = codeMeta.icon;
      tempValue.textContent = Math.round(current.temperature_2m);
      feelsLike.textContent = `${Math.round(current.apparent_temperature)}°C`;
      humidity.textContent = `${current.relative_humidity_2m}%`;
      wind.textContent = `${Math.round(current.wind_speed_10m)} km/h`;
      conditionText.textContent = `${locationName} · ${codeMeta.text}`;
      updateTime.textContent = `当地时间 ${current.time.slice(11, 16)} 更新`;

      currentCard.style.display = "grid";
    }

    function renderChart(hourly) {
      const hours = hourly.time.slice(0, 12);
      const temps = hourly.temperature_2m.slice(0, 12);
      const maxTemp = Math.max(...temps);
      const minTemp = Math.min(...temps);
      rangeLabel.textContent = `${Math.round(minTemp)}°C ~ ${Math.round(maxTemp)}°C`;

      ctx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
      ctx.lineWidth = 3;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      const padding = 25;
      const height = tempCanvas.height - padding * 2;
      const width = tempCanvas.width - padding * 2;
      const step = width / (temps.length - 1 || 1);

      ctx.beginPath();
      temps.forEach((temp, idx) => {
        const x = padding + idx * step;
        const y =
          padding + (1 - (temp - minTemp) / (maxTemp - minTemp || 1)) * height;
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      const gradient = ctx.createLinearGradient(0, 0, tempCanvas.width, 0);
      gradient.addColorStop(0, "#60a5fa");
      gradient.addColorStop(1, "#f97316");
      ctx.strokeStyle = gradient;
      ctx.stroke();

      // Fill area
      ctx.lineTo(padding + (temps.length - 1) * step, tempCanvas.height - padding);
      ctx.lineTo(padding, tempCanvas.height - padding);
      ctx.closePath();
      const fillGradient = ctx.createLinearGradient(0, padding, 0, tempCanvas.height);
      fillGradient.addColorStop(0, "rgba(96, 165, 250, 0.3)");
      fillGradient.addColorStop(1, "rgba(249, 115, 22, 0.05)");
      ctx.fillStyle = fillGradient;
      ctx.fill();

      chartCard.style.display = "block";
      hourlyChips.innerHTML = "";
      hours.forEach((time, idx) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = `${time.slice(11, 16)} · ${Math.round(temps[idx])}°C`;
        hourlyChips.appendChild(chip);
      });
    }

    async function handleSearch(city) {
      const keyword = city || cityInput.value.trim();
      if (!keyword) {
        showError("请输入城市名称");
        return;
      }
      clearError();
      setLoading(true);
      try {
        const location = await geocode(keyword);
        const weather = await fetchWeather(location);
        renderCurrent(location.name, weather);
        renderChart(weather.hourly);
      } catch (err) {
        showError(err.message || "获取天气失败");
      } finally {
        setLoading(false);
      }
    }

    searchBtn.addEventListener("click", () => handleSearch());
    cityInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSearch();
    });

    locBtn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        showError("当前浏览器不支持定位，请手动输入城市");
        return;
      }
      clearError();
      setLoading(true);
      navigator.geolocation.getCurrentPosition(
        async ({ coords }) => {
          try {
            const weather = await fetchWeather(coords);
            renderCurrent("当前位置", weather);
            renderChart(weather.hourly);
          } catch (err) {
            showError(err.message || "定位成功，但获取天气失败");
          } finally {
            setLoading(false);
          }
        },
        () => {
          setLoading(false);
          showError("无法获取定位，请检查权限或手动输入");
        },
        { timeout: 8000 }
      );
    });
  </script>
</body>
</html>
