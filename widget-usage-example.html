<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气组件 - JS模块使用示例</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 20px;
            opacity: 0.9;
        }

        .code-example {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 15px;
            margin-top: 30px;
            color: white;
        }

        .code-example h3 {
            margin-top: 0;
            margin-bottom: 15px;
        }

        .code-example pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
        }

        .code-example code {
            color: #ffd700;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌤️ 天气组件</h1>
        <p>使用JavaScript模块方式集成</p>
    </div>

    <!-- 天气组件容器 -->
    <div id="weather-container"></div>

    <div class="code-example">
        <h3>💻 使用方法：</h3>
        <pre><code>// 1. 引入JS模块
&lt;script src="weather-widget.js"&gt;&lt;/script&gt;

// 2. 创建容器
&lt;div id="weather-container"&gt;&lt;/div&gt;

// 3. 初始化组件
const widget = new WeatherWidget(
    'weather-container', 
    'YOUR_API_KEY_HERE'
);
widget.init('Beijing');</code></pre>
    </div>

    <!-- 引入天气组件JS -->
    <script src="weather-widget.js"></script>
    
    <!-- 初始化组件 -->
    <script>
        // 创建天气组件实例
        // 参数1: 容器ID
        // 参数2: OpenWeatherMap API密钥（可选，未提供时使用模拟数据）
        const weatherWidget = new WeatherWidget('weather-container', 'YOUR_API_KEY_HERE');
        
        // 初始化组件，默认显示北京的天气
        weatherWidget.init('Beijing');
        
        // 您也可以通过方法调用来更新天气
        // weatherWidget.fetchWeather('Shanghai');
        
        console.log('✅ 天气组件已初始化');
        console.log('💡 提示：在weather-widget.js中设置您的API密钥以获取真实数据');
    </script>
</body>
</html>
